<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- 背景 -->
  <rect width="64" height="64" fill="none"/>

  <!-- 怪兽身体 - 像素块风格 -->
  <g fill="#667eea">
    <!-- 主体 -->
    <rect x="20" y="24" width="24" height="20"/>
    <rect x="16" y="28" width="4" height="16"/>
    <rect x="44" y="28" width="4" height="16"/>
    <rect x="20" y="44" width="8" height="8"/>
    <rect x="36" y="44" width="8" height="8"/>
    <!-- 耳朵 -->
    <rect x="16" y="16" width="8" height="8"/>
    <rect x="40" y="16" width="8" height="8"/>
  </g>

  <!-- 眼睛 -->
  <g fill="#ffffff">
    <rect x="24" y="28" width="6" height="6"/>
    <rect x="34" y="28" width="6" height="6"/>
  </g>

  <!-- 瞳孔 -->
  <g fill="#1a1a2e">
    <rect x="26" y="30" width="3" height="3"/>
    <rect x="36" y="30" width="3" height="3"/>
  </g>

  <!-- 嘴巴 -->
  <g fill="#f64c72">
    <rect x="28" y="38" width="8" height="2"/>
    <rect x="26" y="40" width="12" height="2"/>
  </g>

  <!-- 高光 -->
  <g fill="#ffffff" opacity="0.3">
    <rect x="18" y="26" width="4" height="4"/>
    <rect x="42" y="26" width="4" height="4"/>
    <rect x="22" y="30" width="2" height="2"/>
    <rect x="32" y="30" width="2" height="2"/>
  </g>
</svg>