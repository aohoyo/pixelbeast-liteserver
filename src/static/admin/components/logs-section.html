<div class="card">
    <div class="card-header">
        <i class="icon icon-file-text"></i>
        <h3>系统日志</h3>
        <div class="card-header-actions">
            <select id="log-category" style="margin-right: 8px;">
                <option value="http">HTTP 服务</option>
                <option value="ftp">FTP 服务</option>
                <option value="panel">管理面板</option>
            </select>
            <select id="log-type">
                <option value="access">访问日志</option>
                <option value="error">错误日志</option>
            </select>
        </div>
    </div>
    <div class="toolbar">
        <button class="btn" id="refresh-logs"><i class="icon icon-refresh"></i> 刷新</button>
        <button class="btn btn-danger" id="clear-logs"><i class="icon icon-trash"></i> 清空</button>
        <label style="margin-left: auto;"><input type="checkbox" id="auto-scroll" checked> 自动滚动</label>
    </div>
    <pre id="log-viewer">加载中...</pre>
</div>
