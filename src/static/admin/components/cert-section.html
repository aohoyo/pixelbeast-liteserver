<div class="card">
    <div class="card-header">
        <i class="icon icon-shield"></i>
        <h3>SSL 证书管理</h3>
        <button class="btn btn-primary" id="add-cert-btn" style="margin-left: auto;">+ 申请证书</button>
    </div>
    <div class="cert-list" id="cert-list">
        <div class="cert-item">
            <div class="cert-info">
                <h4>默认证书</h4>
                <p class="cert-domain">localhost</p>
                <p class="cert-expire">自签名</p>
            </div>
            <div class="cert-actions">
                <span class="badge badge-warning">自签名</span>
            </div>
        </div>
    </div>
</div>
