<!-- 设置页 -->
<section class="content-section" id="settings-section">
    <div class="section-header">
        <span class="section-title">系统设置</span>
        <div class="server-time" id="server-time"></div>
    </div>

    <div class="settings-container">
        <!-- Tab 切换 -->
        <div class="settings-tabs">
            <button class="settings-tab active" data-tab="panel">面板设置</button>
            <button class="settings-tab" data-tab="directory">目录设置</button>
            <button class="settings-tab" data-tab="log">日志设置</button>
            <button class="settings-tab" data-tab="security">安全设置</button>
        </div>

        <!-- 面板设置 -->
        <div class="settings-content active" id="settings-panel">
            <div class="settings-form">
                <div class="form-group">
                    <label class="form-label">管理员账号</label>
                    <input type="text" class="form-input" id="admin-username" placeholder="admin">
                </div>
                <div class="form-group">
                    <label class="form-label">管理员密码</label>
                    <div class="form-group-inline">
                        <input type="password" class="form-input-inline" id="admin-password" placeholder="留空不修改">
                        <button class="btn btn-secondary" id="toggle-password" type="button">显示</button>
                        <button class="btn btn-secondary" id="generate-password" type="button">生成</button>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">面板端口</label>
                    <input type="number" class="form-input port-input" id="admin-port" min="1" max="65535" value="9527">
                </div>
                <div class="form-group">
                    <label class="form-label">安全入口路径</label>
                    <input type="text" class="form-input" id="admin-path" placeholder="/admin">
                    <p class="form-hint">管理面板的访问路径，修改后需要重启</p>
                </div>
            </div>
        </div>

        <!-- 目录设置 -->
        <div class="settings-content" id="settings-directory">
            <div class="settings-form">
                <div class="form-group">
                    <label class="form-label">WEB 根目录</label>
                    <div id="web-root-picker"></div>
                    <p class="form-hint">网站静态文件的根目录</p>
                </div>
                <div class="form-group">
                    <label class="form-label">FTP 根目录</label>
                    <div id="ftp-root-picker"></div>
                    <p class="form-hint">FTP 服务的根目录，用户将在此目录下管理文件</p>
                </div>
                <div class="form-group">
                    <label class="form-label">备份目录</label>
                    <div id="backup-dir-picker"></div>
                    <p class="form-hint">系统备份文件的存储目录</p>
                </div>
            </div>
        </div>

        <!-- 日志设置 -->
        <div class="settings-content" id="settings-log">
            <div class="settings-form">
                <div class="form-group">
                    <label class="form-label">日志保留天数</label>
                    <input type="number" class="form-input" id="log-retention-days" min="1" max="365" value="30">
                </div>
                <div class="form-group">
                    <label class="form-label">单个日志文件大小 (MB)</label>
                    <input type="number" class="form-input" id="log-max-size-mb" min="1" max="1000" value="100">
                </div>
                <div class="form-group">
                    <label class="form-label">日志压缩天数</label>
                    <input type="number" class="form-input" id="log-compress-days" min="0" max="30" value="7">
                    <p class="form-hint">超过此天数的日志将被压缩</p>
                </div>
                <div class="form-group">
                    <label class="form-label">日志清理时间</label>
                    <input type="number" class="form-input" id="log-cleanup-hour" min="0" max="23" value="3">
                    <p class="form-hint">每天几点执行日志清理（0-23）</p>
                </div>
                <div class="form-group">
                    <label class="form-label">日志级别</label>
                    <select class="form-select" id="log-level">
                        <option value="debug">Debug</option>
                        <option value="info" selected>Info</option>
                        <option value="warn">Warn</option>
                        <option value="error">Error</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">分类日志级别</label>
                    <div class="form-group-inline">
                        <input type="text" class="form-input-inline" id="log-level-http" placeholder="HTTP 日志级别">
                        <input type="text" class="form-input-inline" id="log-level-ftp" placeholder="FTP 日志级别">
                        <input type="text" class="form-input-inline" id="log-level-panel" placeholder="面板日志级别">
                    </div>
                    <p class="form-hint">留空则使用全局日志级别</p>
                </div>
            </div>
        </div>

        <!-- 安全设置 -->
        <div class="settings-content" id="settings-security">
            <div class="settings-form">
                <div class="form-group">
                    <label class="form-label">IP 白名单</label>
                    <textarea class="form-textarea" id="ip-whitelist" rows="4" placeholder="每行一个 IP 或 CIDR，留空则允许所有访问"></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">会话超时时间（分钟）</label>
                    <input type="number" class="form-input" id="session-timeout" min="5" max="1440" value="60">
                </div>
                <div class="form-group">
                    <label class="form-label">操作日志保留天数</label>
                    <input type="number" class="form-input" id="audit-log-days" min="0" max="365" value="30">
                    <p class="form-hint">设为 0 则不保留操作日志</p>
                </div>
            </div>
        </div>

        <!-- 操作按钮 -->
        <div class="settings-actions">
            <button class="btn btn-secondary" id="reset-settings">恢复默认</button>
            <button class="btn btn-primary" id="save-settings">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                    <polyline points="17 21 17 13 7 13 7 21"></polyline>
                    <polyline points="7 3 7 8 15 8"></polyline>
                </svg>
                保存设置
            </button>
        </div>
    </div>
</section>
