<!-- 设置页面 -->
<div class="settings-page">
    <!-- 顶部操作栏 -->
    <div class="settings-header">
        <div class="settings-title">
            <h2>系统设置</h2>
            <p>配置服务参数和管理选项</p>
        </div>
        <div class="settings-actions">
            <button class="btn btn-default" id="btn-reset">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                    <path d="M3 3v5h5"/>
                </svg>
                重置
            </button>
            <button class="btn btn-primary" id="btn-save">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                    <polyline points="17 21 17 13 7 13 7 21"/>
                    <polyline points="7 3 7 8 15 8"/>
                </svg>
                保存
            </button>
        </div>
    </div>

    <!-- 标签页切换 -->
    <div class="settings-tabs">
        <button class="tab-btn active" data-tab="basic">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="3"/>
                <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
            </svg>
            基础设置
        </button>
        <button class="tab-btn" data-tab="http">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <line x1="2" y1="12" x2="22" y2="12"/>
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
            </svg>
            HTTP 服务
        </button>
        <button class="tab-btn" data-tab="admin">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
            </svg>
            管理面板
        </button>
        <button class="tab-btn" data-tab="log">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
                <line x1="16" y1="13" x2="8" y2="13"/>
                <line x1="16" y1="17" x2="8" y2="17"/>
                <polyline points="10 9 9 9 8 9"/>
            </svg>
            日志配置
        </button>
        <button class="tab-btn" data-tab="backup">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="17 8 12 3 7 8"/>
                <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
            备份设置
        </button>
    </div>

    <!-- 设置内容区 -->
    <div class="settings-content">
        <!-- 基础设置 -->
        <div class="tab-pane active" id="tab-basic">
            <div class="settings-section">
                <h3 class="section-title">服务配置</h3>
                <div class="form-group">
                    <label class="form-label">服务器名称</label>
                    <input type="text" class="form-input" id="server-name" placeholder="PixelBeast Server">
                    <p class="form-hint">显示在管理面板标题</p>
                </div>
                <div class="form-group">
                    <label class="form-label">时区</label>
                    <select class="form-select" id="timezone">
                        <option value="Asia/Shanghai">Asia/Shanghai (UTC+8)</option>
                        <option value="UTC">UTC</option>
                        <option value="America/New_York">America/New_York</option>
                        <option value="Europe/London">Europe/London</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- HTTP 服务 -->
        <div class="tab-pane" id="tab-http">
            <div class="settings-section">
                <h3 class="section-title">HTTP 配置</h3>
                <div class="form-group">
                    <label class="form-label">HTTP 端口</label>
                    <input type="number" class="form-input" id="http-port" min="1" max="65535" placeholder="8080">
                    <p class="form-hint">网站服务监听端口</p>
                </div>
                <div class="form-group">
                    <label class="form-label">WEB 根目录</label>
                    <div id="web-root-picker" class="directory-picker"></div>
                    <p class="form-hint">静态文件存放目录</p>
                </div>
                <div class="form-group">
                    <label class="form-label">默认首页文件</label>
                    <input type="text" class="form-input" id="index-files" placeholder="index.html, index.htm">
                    <p class="form-hint">多个文件用逗号分隔</p>
                </div>
                <div class="form-group">
                    <label class="form-label">
                        <input type="checkbox" id="auto-index">
                        启用目录列表
                    </label>
                    <p class="form-hint">当没有首页文件时显示目录内容</p>
                </div>
            </div>
        </div>

        <!-- 管理面板 -->
        <div class="tab-pane" id="tab-admin">
            <div class="settings-section">
                <h3 class="section-title">管理面板配置</h3>
                <div class="form-group">
                    <label class="form-label">管理端口</label>
                    <input type="number" class="form-input" id="admin-port" min="1" max="65535" placeholder="9527">
                    <p class="form-hint">管理面板监听端口</p>
                </div>
                <div class="form-group">
                    <label class="form-label">安全入口路径</label>
                    <input type="text" class="form-input" id="admin-path" placeholder="/admin">
                    <p class="form-hint">隐藏后台地址，提升安全性</p>
                </div>
                <div class="form-group">
                    <label class="form-label">管理员用户名</label>
                    <input type="text" class="form-input" id="admin-username" placeholder="admin">
                </div>
                <div class="form-group">
                    <label class="form-label">管理员密码</label>
                    <div class="password-input-group">
                        <input type="password" class="form-input" id="admin-password" placeholder="不修改请留空">
                        <button type="button" class="btn-icon password-toggle">
                            <svg class="icon icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg class="icon icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </button>
                    </div>
                    <p class="form-hint">留空表示不修改密码</p>
                </div>
            </div>
        </div>

        <!-- 日志配置 -->
        <div class="tab-pane" id="tab-log">
            <div class="settings-section">
                <h3 class="section-title">日志配置</h3>
                <div class="form-group">
                    <label class="form-label">日志级别</label>
                    <select class="form-select" id="log-level">
                        <option value="debug">DEBUG - 调试</option>
                        <option value="info">INFO - 信息</option>
                        <option value="warn">WARN - 警告</option>
                        <option value="error">ERROR - 错误</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">日志保留天数</label>
                    <input type="number" class="form-input" id="log-retention" min="1" max="365" placeholder="30">
                    <p class="form-hint">超过此天数的日志将被清理</p>
                </div>
                <div class="form-group">
                    <label class="form-label">日志文件最大大小 (MB)</label>
                    <input type="number" class="form-input" id="log-max-size" min="10" max="1000" placeholder="100">
                </div>
                <div class="form-group">
                    <label class="form-label">日志压缩天数</label>
                    <input type="number" class="form-input" id="log-compress" min="1" max="30" placeholder="7">
                    <p class="form-hint">超过此天数的日志将被压缩</p>
                </div>
                <div class="form-group">
                    <label class="form-label">日志清理时间</label>
                    <input type="number" class="form-input" id="log-cleanup-hour" min="0" max="23" placeholder="3">
                    <p class="form-hint">每天在此时间执行清理（24 小时制）</p>
                </div>
            </div>
        </div>

        <!-- 备份设置 -->
        <div class="tab-pane" id="tab-backup">
            <div class="settings-section">
                <h3 class="section-title">备份配置</h3>
                <div class="form-group">
                    <label class="form-label">备份目录</label>
                    <div id="backup-dir-picker" class="directory-picker"></div>
                    <p class="form-hint">配置文件备份存放位置</p>
                </div>
                <div class="form-group">
                    <label class="form-label">
                        <input type="checkbox" id="auto-backup">
                        启用自动备份
                    </label>
                    <p class="form-hint">保存配置时自动备份</p>
                </div>
            </div>
        </div>
    </div>
</div>
