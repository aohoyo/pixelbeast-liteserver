<div class="card">
    <div class="card-header">
        <i class="icon icon-globe"></i>
        <h3>网站管理</h3>
        <div class="card-header-actions">
            <button class="btn btn-primary" id="add-site-btn">
                <i class="icon icon-plus"></i> 添加网站
            </button>
        </div>
    </div>

    <div class="service-tab-container">
        <!-- 工具栏 -->
        <div class="toolbar">
            <div class="toolbar-left">
                <!-- 站点服务控制 -->
                <div class="service-control">
                    <span class="service-label">站点服务</span>
                    <button class="btn btn-sm service-toggle" id="site-service-toggle">
                        <svg class="icon start-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                        <svg class="icon stop-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="6" width="12" height="12"></rect></svg>
                        <span class="btn-text">启动</span>
                    </button>
                    <button class="btn btn-sm" id="site-service-restart">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg> 重启
                    </button>
                    <button class="btn btn-sm" id="site-service-reload">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2v6h-6"></path><path d="M3 12a9 9 0 0 1 15-6.7L21 10"></path><path d="M3 22v-6h6"></path><path d="M21 12a9 9 0 0 1-15 6.7L3 14"></path></svg> 重载配置
                    </button>
                    <span class="service-status" id="site-service-status">已停止</span>
                </div>
            </div>
            <div class="toolbar-right">
                <div class="toolbar-search">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                    <input type="text" id="sites-search" placeholder="搜索站点名称、域名..." />
                </div>
                <div class="toolbar-filter">
                    <select id="sites-type-filter">
                        <option value="">全部类型</option>
                        <option value="static">静态站点</option>
                        <option value="proxy">反向代理</option>
                    </select>
                </div>
                <div class="toolbar-filter">
                    <select id="sites-status-filter">
                        <option value="">全部状态</option>
                        <option value="enabled">运行中</option>
                        <option value="disabled">已停止</option>
                    </select>
                </div>
                <button class="btn btn-sm" id="sites-refresh-btn">
                    <i class="icon icon-refresh"></i> 刷新
                </button>
            </div>
        </div>

        <!-- 数据表格 -->
        <div class="table-wrapper" id="sites-table-container"></div>

        <!-- 分页 -->
        <div class="table-footer">
            <div id="sites-pagination"></div>
        </div>
    </div>
</div>
<div class="modal" id="site-modal">
    <div class="modal-overlay"></div>
    <div class="modal-container" style="width: 560px; max-width: 90vw;">
        <div class="modal-header">
            <h3 id="site-modal-title">添加网站</h3>
            <button class="modal-close" id="site-modal-close">&times;</button>
        </div>
        <div class="modal-body">
            <form class="site-form" id="site-form">
                <div class="form-group">
                    <label class="form-label">站点名称 <span class="required">*</span></label>
                    <input type="text" class="form-input" id="site-form-name" placeholder="我的网站" required />
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">站点类型</label>
                        <select class="form-select" id="site-form-type">
                            <option value="static">静态站点</option>
                            <option value="proxy">反向代理</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">端口</label>
                        <input type="number" class="form-input" id="site-form-port" placeholder="留空使用共享端口" min="1" max="65535" />
                        <span class="form-hint">0 = 共享端口，由域名区分</span>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">域名</label>
                    <input type="text" class="form-input" id="site-form-domain" placeholder="example.com, www.example.com" />
                    <span class="form-hint">多个域名用逗号分隔</span>
                </div>

                <!-- 静态站点配置 -->
                <div id="site-static-fields">
                    <div class="form-group">
                        <label class="form-label">根目录</label>
                        <div class="dir-input-wrapper">
                            <input type="text" class="form-input" id="site-form-root" placeholder="./sites/default" />
                            <button type="button" class="btn btn-secondary dir-browse-btn" data-dir="site-form-root">
                                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                            </button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">首页文件</label>
                        <input type="text" class="form-input" id="site-form-index-files" placeholder="index.html, index.htm" />
                        <span class="form-hint">多个文件用逗号分隔，按顺序匹配</span>
                    </div>
                    <div class="form-group">
                        <label class="form-label">目录浏览</label>
                        <label class="toggle">
                            <input type="checkbox" id="site-form-auto-index">
                            <span class="toggle-slider"></span>
                        </label>
                        <span class="form-hint">找不到首页文件时显示目录列表</span>
                    </div>
                </div>

                <!-- 反向代理配置 -->
                <div id="site-proxy-fields" style="display: none;">
                    <div class="form-group">
                        <label class="form-label">代理目标 <span class="required">*</span></label>
                        <input type="text" class="form-input" id="site-form-proxy" placeholder="http://localhost:3000" />
                        <span class="form-hint">目标服务器地址</span>
                    </div>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn" id="site-modal-cancel">取消</button>
            <button class="btn btn-primary" id="site-modal-confirm">确定</button>
        </div>
    </div>
</div>

<!-- 删除确认弹窗 -->
<div class="modal" id="site-delete-modal">
    <div class="modal-overlay"></div>
    <div class="modal-container" style="width: 400px; max-width: 90vw;">
        <div class="modal-header">
            <h3>确认删除</h3>
            <button class="modal-close" id="site-delete-modal-close">&times;</button>
        </div>
        <div class="modal-body">
            <div class="delete-warning">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <p>确定要删除站点 <strong id="site-delete-name"></strong> 吗？</p>
                <p class="option-hint">删除后将无法恢复，站点配置将被永久移除</p>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn" id="site-delete-cancel">取消</button>
            <button class="btn btn-danger" id="site-delete-confirm">删除</button>
        </div>
    </div>
</div>
