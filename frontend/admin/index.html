<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{CSRF_TOKEN}}">
    <title>{{SERVER_NAME}} - 管理面板</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="css/base.css">
    <!-- 布局样式 -->
    <link rel="stylesheet" href="css/layout.css">
    <!-- 组件样式 -->
    <link rel="stylesheet" href="css/components/icon.css">
    <link rel="stylesheet" href="css/components/button.css">
    <link rel="stylesheet" href="css/components/card.css">
    <link rel="stylesheet" href="css/components/badge.css">
    <link rel="stylesheet" href="css/components/status.css">
    <link rel="stylesheet" href="css/components/modal.css">
    <link rel="stylesheet" href="css/components/dialog.css">
    <link rel="stylesheet" href="css/components/tooltip.css">
    <link rel="stylesheet" href="css/components/form.css">
    <link rel="stylesheet" href="css/components/settings.css">
    <link rel="stylesheet" href="css/components/logs.css">
    <link rel="stylesheet" href="css/components/service-tab.css">
    <link rel="stylesheet" href="css/components/sites.css">
    <link rel="stylesheet" href="css/components/file-browser.css">
    <link rel="stylesheet" href="css/components/data-table.css">
    <link rel="stylesheet" href="css/components/toolbar.css">
    <link rel="stylesheet" href="css/components/ftp.css">
    <link rel="stylesheet" href="css/components/cert.css">
    <link rel="stylesheet" href="css/components/cleanup.css">
    <link rel="stylesheet" href="css/components/skeleton.css">
    <link rel="stylesheet" href="css/components/file-manager.css">
    <!-- 页面样式 -->
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <!-- 顶部栏 -->
    <header class="top-header">
        <div class="header-left">
            <div class="brand">
                <img src="images/logo.png" alt="Logo" class="brand-logo">
                <span class="brand-name">{{SERVER_NAME}}</span>
            </div>
            <div class="header-os" id="header-os">
                <img class="header-os-icon" id="header-os-icon" src="./images/os/linux.svg" alt="OS">
                <span class="header-os-name" id="header-os-name">--</span>
                <div class="header-os-detail" id="header-os-detail">
                    <div class="os-detail-row"><span>主机名</span><span id="os-hostname">--</span></div>
                    <div class="os-detail-row"><span>系统</span><span id="os-name-full">--</span></div>
                    <div class="os-detail-row"><span>架构</span><span id="os-arch">--</span></div>
                    <div class="os-detail-row"><span>内核</span><span id="os-kernel">--</span></div>
                    <div class="os-detail-row"><span>服务</span><span id="os-uptime">--</span></div>
                    <div class="os-detail-row"><span>系统</span><span id="os-system-uptime">--</span></div>
                </div>
            </div>
        </div>
    <div class="header-right">
        <span class="header-version" id="header-version">{{VERSION}}</span>
        <button class="header-btn" id="header-update-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
            <span>更新</span>
        </button>
        <button class="header-btn" id="header-restart-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
            <span>重启</span>
        </button>
    </div>
    </header>

    <!-- 主容器 -->
    <div class="main-container">
        <!-- 左侧菜单 -->
        <aside class="left-menu" id="left-menu">
            <nav class="menu-nav">
                <a class="menu-item active" data-tab="home" href="#">
                    <i class="icon icon-home"></i>
                    <span class="menu-label">首页</span>
                </a>
                <a class="menu-item" data-tab="sites" href="#">
                    <i class="icon icon-globe"></i>
                    <span class="menu-label">站点</span>
                </a>
                <a class="menu-item" data-tab="ftp" href="#">
                    <i class="icon icon-upload"></i>
                    <span class="menu-label">FTP</span>
                </a>
                <a class="menu-item" data-tab="files" href="#">
                    <i class="icon icon-folder"></i>
                    <span class="menu-label">文件</span>
                </a>
                <a class="menu-item" data-tab="terminal" href="#">
                    <i class="icon icon-terminal"></i>
                    <span class="menu-label">终端</span>
                </a>
                <a class="menu-item" data-tab="logs" href="#">
                    <i class="icon icon-file-text"></i>
                    <span class="menu-label">日志</span>
                </a>
                <a class="menu-item" data-tab="cert" href="#">
                    <i class="icon icon-shield"></i>
                    <span class="menu-label">证书</span>
                </a>
                <a class="menu-item" data-tab="settings" href="#">
                    <i class="icon icon-settings"></i>
                    <span class="menu-label">设置</span>
                </a>
            </nav>

            <div class="menu-footer">
                <div class="menu-info">
                    <span class="menu-slogan">小而强悍，无所不能</span>
                </div>
                <a class="menu-item menu-logout" id="logout-btn" href="#">
                    <i class="icon icon-close"></i>
                    <span class="menu-label">退出</span>
                </a>
            </div>
        </aside>

        <!-- 右侧内容区 -->
        <main class="right-content">
            <!-- 内容区域（组件动态加载） -->
            <div class="content-area">
                <p class="loading">加载中...</p>
            </div>
        </main>
    </div>

    <script type="module" src="js/core/error-handler.js"></script>
    <script type="module" src="js/core/template.js"></script>
    <script type="module" src="js/core/keyboard.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
