<!-- 新建目录对话框 -->
<div class="modal" id="mkdir-modal">
    <div class="modal-content">
        <h3>新建目录</h3>
        <input type="text" id="mkdir-name" placeholder="目录名称">
        <div class="modal-actions">
            <button id="mkdir-cancel">取消</button>
            <button id="mkdir-confirm" class="btn btn-primary">创建</button>
        </div>
    </div>
</div>
